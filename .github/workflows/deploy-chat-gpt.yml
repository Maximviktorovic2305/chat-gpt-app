name: Native site quality and deployment
on:
  push:
    branches: [master, native-isolation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_DEPLOY_SITE_ADDRESS: https://ai-contact.site
      NEXT_PUBLIC_SERVER_URL: https://ai-contact.site
      NEXT_PUBLIC_YANDEX_METRIKA_ID: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - name: Backend checks
        working-directory: server
        run: |
          npm run lint
          npm run typecheck
          npm test -- --runInBand
          npm run lint:dead-code --if-present
          npm audit --audit-level=low
          npm run build
          test -f dist/main.js
      - run: npm ci --no-audit --no-fund
        working-directory: client
      - name: Frontend checks
        working-directory: client
        run: |
          npm run lint
          npm run typecheck
          npm run lint:fsd
          npm run lint:dead-code --if-present
          npm run test:security
          npm audit --audit-level=low
          npm run build
          test -f dist/standalone/server.js
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 35
    concurrency:
      group: chat-production
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DEPLOY_SHA
          script: |
            set -Eeuo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            script_file="$(mktemp)"
            trap 'rm -f "$script_file"' EXIT
            git -C /home/max/chat-gpt-app fetch origin "$DEPLOY_SHA"
            git -C /home/max/chat-gpt-app show "$DEPLOY_SHA:deploy/deploy.sh" > "$script_file"
            bash "$script_file"
